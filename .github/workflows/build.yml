name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Keystore
        run: echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/signing/serenite.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          KEYSTORE_PASSWORD: b6TXfcS83H8gGqOgrc_YcC2G
          KEY_ALIAS: serenite
          KEY_PASSWORD: b6TXfcS83H8gGqOgrc_YcC2G
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle testReleaseUnitTest assembleRelease --no-daemon 2>&1 | tee build.log
          mv app/build/outputs/apk/release/*.apk "Serenite-1.0.${{ github.run_number }}.apk"

      - name: Rapport d'erreurs (si échec)
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Could not (find|resolve)|FAILED|expected:|AssertionError|Exception|^  > " build.log | grep -v "> Task" | head -40 | while IFS= read -r l; do echo "::error::$l"; done || true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Sérénité 1.0.${{ github.run_number }}
          files: Serenite-1.0.${{ github.run_number }}.apk
          make_latest: true
